name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends poppler-utils     # pdftotext: how Linux reads PDFs (macOS has it built in)
      - run: for f in static/*.js; do node --check "$f"; done                  # the UI has no tests: at least it must parse
      - run: python tests.py
      - run: python app.py --check || true

  windows:
    runs-on: windows-latest      # imports only: the fake Claude used by the tests is a Unix script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -c "import app, advisor, ingest, fulltext, brain, net; print('imports ok')"
      - run: python app.py --check; exit 0      # informative: the runner has no yt-dlp or Claude Code
